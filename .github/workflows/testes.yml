name: Testes do aplicativo

on:
  pull_request:
  push:
    branches: [main, feat/ymir-3-gamer-ui]

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir sintaxe
        run: python -m py_compile ymir_boss_timer.py ymir_features.py ymir_theme.py
      - name: Executar testes de lógica e interface
        env:
          YMIR_GUI_TESTS: "1"
        run: python -m unittest discover -s tests -v
