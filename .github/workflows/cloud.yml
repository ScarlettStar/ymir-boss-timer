name: Nuvem - regras e isolamento
on:
  pull_request:
    paths: ['cloud/**', 'firebase.json', '.github/workflows/cloud.yml']
  push:
    branches: [main]
    paths: ['cloud/**', 'firebase.json', '.github/workflows/cloud.yml']
permissions:
  contents: read
jobs:
  regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
        working-directory: cloud
      - run: npx --yes firebase-tools@14.5.1 emulators:exec --only firestore --project demo-ymir-sync 'npm --prefix cloud test'
