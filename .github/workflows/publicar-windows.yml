name: Publicar aplicativo Windows

on:
  push:
    branches: [main]
    paths:
      - "ymir_boss_timer.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ymir-publicar-main
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descobrir versão e conferir Releases existentes
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-Content "ymir_boss_timer.py" -Raw -Encoding utf8
          if ($source -match 'APP_VERSION\s*=\s*"(\d+\.\d+\.\d+)"') {
            $version = $Matches[1]
          } else {
            throw "APP_VERSION X.Y.Z não encontrado no código."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $tag = "v$version"
          # release list retorna exit 0 inclusive quando ainda não existe Release.
          $published = @(gh release list --repo "$env:GITHUB_REPOSITORY" --json tagName --limit 100 | ConvertFrom-Json)
          if ($published.tagName -contains $tag) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag já existe. Não republicar esta versão."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Nova versão: $tag"
          }

      - name: Conferir sintaxe
        if: steps.release.outputs.exists == 'false'
        run: python -m py_compile ymir_boss_timer.py

      - name: Executar testes
        if: steps.release.outputs.exists == 'false'
        run: python -m unittest discover -s tests -v

      - name: Instalar dependências do Windows
        if: steps.release.outputs.exists == 'false'
        run: python -m pip install --upgrade pip pyinstaller pystray Pillow winotify

      - name: Compilar executável
        if: steps.release.outputs.exists == 'false'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name YmirBossTimer --collect-all winotify ymir_boss_timer.py

      - name: Testar inicialização do executável Windows
        if: steps.release.outputs.exists == 'false'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $marker = Join-Path $env:RUNNER_TEMP "ymir-boot-verified.txt"
          Remove-Item -LiteralPath $marker -ErrorAction SilentlyContinue
          $env:YMIR_READY_MARKER = $marker
          $process = $null
          try {
            $path = (Resolve-Path "dist/YmirBossTimer.exe").Path
            $process = Start-Process -FilePath $path -PassThru -ErrorAction Stop
            $verified = $false
            for ($i=0; $i -lt 75; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $marker) {
                $reported = (Get-Content -LiteralPath $marker -Raw -Encoding ASCII).Trim()
                if ($reported -eq $env:RELEASE_VERSION) {
                  $verified = $true
                  break
                }
              }
            }
            if (-not $verified) {
              throw "O EXE Windows não sinalizou abertura da interface após 75 segundos."
            }
            Write-Host "Interface Python/Tk iniciou corretamente na versão $env:RELEASE_VERSION."
          } finally {
            $env:YMIR_READY_MARKER = ""
            if ($process) {
              taskkill.exe /PID $process.Id /T /F 2>$null
            }
          }

      - name: Gerar checksum SHA-256
        if: steps.release.outputs.exists == 'false'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/YmirBossTimer.exe" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/YmirBossTimer.exe.sha256", $hash, [System.Text.Encoding]::ASCII)

      - name: Publicar Release no GitHub
        if: steps.release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          gh release create "$tag" "dist/YmirBossTimer.exe" "dist/YmirBossTimer.exe.sha256" --target "$env:GITHUB_SHA" --title "Ymir Boss Timer $tag" --notes "Aplicativo Windows. Release gerado automaticamente a partir do código testado. SHA-256 incluído."
