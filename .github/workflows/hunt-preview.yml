name: Integração - preview Windows
on:
  pull_request:
    paths: ['ymir_*.py', '.github/workflows/hunt-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller Pillow pystray winotify
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name YmirBossTimer ymir_boss_timer.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ymir-Timer-integracao-preview
          path: dist/YmirBossTimer.exe
