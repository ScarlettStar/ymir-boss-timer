name: Android - compilar e testar
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Testes, lint e APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Ymir-Android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tools
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar no Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.scarlettstar.ymir/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/ymir-android.png
            adb pull /sdcard/ymir-android.png ../ymir-android.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-reports
          path: |
            android/app/build/reports/androidTests/
            ymir-android.png
